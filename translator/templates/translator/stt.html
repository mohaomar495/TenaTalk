{% load static %}

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>TenaTalk - Speech to Text</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/common.css' %}" rel="stylesheet">
</head>

<body>

    <div class="container">

        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}">🌍 TenaTalk</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'text_translation' %}">Text Translation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'stt' %}">Speech to Text</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'tts' %}">Text to Speech</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <h1 class="mb-4">🎤 Speech to Text</h1>

        <!-- Auto CSRF from Django -->
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

        <div class="card card-custom">
            <div class="card-body">
                <div class="mb-3">
                    <label>Role</label>
                    <select id="role" class="form-select">
                        <option value="patient">Patient</option>
                        <option value="clinician">Clinician</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Source Language Hint</label>
                    <select id="source_hint" class="form-select">
                        <option value="am-ET">Amharic</option>
                        <option value="so-SO">Somali</option>
                        <option value="om-ET">Oromo</option>
                        <option value="en-US">English</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Target Language</label>
                    <select id="target_lang" class="form-select">
                        <option value="en">English</option>
                        <option value="am">Amharic</option>
                        <option value="om">Oromo</option>
                        <option value="so">Somali</option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Voice Gender</label>
                        <select id="voice_gender" class="form-select">
                            <option value="NEUTRAL">Neutral</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label>Speed: <span id="speed_val">1.0</span>x</label>
                        <input type="range" id="voice_speed" class="form-range" min="0.25" max="4.0" step="0.25"
                            value="1.0" oninput="document.getElementById('speed_val').innerText = this.value">
                    </div>
                </div>

                <div class="mb-3">
                    <button id="recordBtn" class="btn btn-primary">🎤 Start Recording</button>
                    <button id="stopBtn" class="btn btn-danger" disabled>⏹️ Stop</button>
                </div>

                <div id="speechResults" class="mt-4"></div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/stt.js' %}"></script>

</body>

</html>
