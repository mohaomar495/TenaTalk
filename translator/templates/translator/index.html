{% extends "translator/base.html" %}

{% block title %}Translator - TenaTalk{% endblock %}

{% block extra_css %}
<style>
    .translator-header {
        background: linear-gradient(135deg, #4a90e2 0%, #50c878 100%);
        color: white;
        padding: 3rem 0;
        margin-bottom: 2rem;
        border-radius: 15px;
    }
    
    .tab-content {
        animation: fadeInUp 0.5s ease-out;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="translator-header text-center animate-fade-in">
        <h1 class="display-4 fw-bold mb-3">
            <i class="fas fa-language"></i> TenaTalk Translator
        </h1>
        <p class="lead mb-0">Real-time speech and text translation for Ethiopian languages</p>
    </div>

    <div class="card p-4 animate-fade-in"  style="animation-delay: 0.2s;">

        <!-- Auto CSRF from Django -->
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

        <!-- Tabs Navigations-->
        <ul class="nav nav-tabs mb-4" id="translationTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="speech-tab" data-bs-toggle="tab" data-bs-target="#speech"
                    type="button" role="tab">
                    🎤 Speech Recording
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="text-tab" data-bs-toggle="tab" data-bs-target="#text" type="button"
                    role="tab">
                    📝 Text Translation
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="translationTabsContent">

            <!-- Speech Recording Tab -->
            <div class="tab-pane fade show active" id="speech" role="tabpanel">
                <div class="mb-3">
                    <label>Role</label>
                    <select id="role" class="form-select">
                        <option value="patient">Patient</option>
                        <option value="clinician">Clinician</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Source Language Hint</label>
                    <select id="source_hint" class="form-select">
                        <option value="am-ET">Amharic</option>
                        <option value="so-SO">Somali</option>
                        <option value="om-ET">Oromo</option>
                        <option value="en-US">English</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Target Language</label>
                    <select id="target_lang" class="form-select">
                        <option value="en">English</option>
                        <option value="am">Amharic</option>
                        <option value="om">Oromo</option>
                        <option value="so">Somali</option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Voice Gender</label>
                        <select id="voice_gender" class="form-select">
                            <option value="NEUTRAL">Neutral</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label>Speed: <span id="speed_val">1.0</span>x</label>
                        <input type="range" id="voice_speed" class="form-range" min="0.25" max="4.0" step="0.25"
                            value="1.0" oninput="document.getElementById('speed_val').innerText = this.value">
                    </div>
                </div>

                <div class="mb-3">
                    <button id="recordBtn" class="btn btn-primary">🎤 Start Recording</button>
                    <button id="stopBtn" class="btn btn-danger" disabled>⏹️ Stop</button>
                </div>

                <div id="speechResults" class="mt-4"></div>
            </div>

            <!-- Text Translation Tab -->
            <div class="tab-pane fade" id="text" role="tabpanel">
                <div class="mb-3">
                    <label for="inputText" class="form-label">Enter text to translate</label>
                    <textarea id="inputText" class="form-control" rows="5"
                        placeholder="Type or paste your text here..."></textarea>
                </div>

                <div class="mb-3">
                    <label for="textTargetLang">Target Language</label>
                    <select id="textTargetLang" class="form-select">
                        <option value="en">English</option>
                        <option value="am">Amharic</option>
                        <option value="om">Oromo</option>
                        <option value="so">Somali</option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Voice Gender</label>
                        <select id="text_voice_gender" class="form-select">
                            <option value="NEUTRAL">Neutral</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label>Speed: <span id="text_speed_val">1.0</span>x</label>
                        <input type="range" id="text_voice_speed" class="form-range" min="0.25" max="4.0" step="0.25"
                            value="1.0" oninput="document.getElementById('text_speed_val').innerText = this.value">
                    </div>
                </div>

                <div class="mb-3">
                    <button id="translateBtn" class="btn btn-primary">🔄 Translate</button>
                </div>

                <div id="textResults" class="mt-4"></div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/app.js' %}"></script>
{% endblock %}
